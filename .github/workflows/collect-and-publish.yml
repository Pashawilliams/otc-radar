name: Collect OTC chats and publish

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'otc_radar/**'
      - 'config/**'
      - 'web/**'
      - '!web/data/**'
      - 'tests/**'
      - 'requirements-telegram.txt'
      - '.github/workflows/collect-and-publish.yml'

permissions:
  contents: read

concurrency:
  group: otc-collection-and-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      site_ready: ${{ steps.site.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check collector and dashboard
        run: |
          python -m unittest discover -s tests
          node --check web/app.js
      - name: Install optional Telegram client
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          if [ -n "$TELEGRAM_SESSION" ]; then
            python -m pip install -r requirements-telegram.txt
          fi
      - name: Collect public chats
        id: collection
        continue-on-error: true
        env:
          OTC_CATEGORY: ${{ vars.OTC_CATEGORY || 'crypto' }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: >-
          python -m otc_radar collect
          --budget-seconds 300
          --max-profiles 180
          --max-searches 4
          --target 1500
          --category "$OTC_CATEGORY"
      - name: Save collection state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json web/data/chats.json web/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update verified OTC directory'
            git push origin HEAD:main
          fi
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Mark site artifact ready
        id: site
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Report collection failure
        if: steps.collection.outcome == 'failure'
        run: |
          echo '::error::Collector failed. The saved error status will still be published; previous verified records are preserved.'
          exit 1

  deploy:
    needs: collect
    if: ${{ always() && needs.collect.outputs.site_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
